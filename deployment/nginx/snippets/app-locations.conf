limit_conn doq_conn 50;

# Login / signup / password endpoints: stricter rate
location /auth/ {
    limit_req zone=doq_auth burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://doq_app;
}

# Uploaded images are served by the app from the persistent uploads volume
location /uploads/ {
    limit_req zone=doq_general burst=100 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://doq_app;
    expires 7d;
}

location / {
    limit_req zone=doq_general burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://doq_app;
}
