# Let's Encrypt HTTP-01 challenge (webroot shared with the certbot container)
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

# Health probe for docker / deploy.sh (does not touch the app)
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
