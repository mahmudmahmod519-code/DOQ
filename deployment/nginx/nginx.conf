# DOQ reverse proxy (nginx 1.27). Site config is rendered from
# deployment/nginx/active/doq.conf.template into /etc/nginx/conf.d/doq.conf on container start.
user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

    # Uploads: multer accepts images up to 5 MB (middlware/upload.js); leave headroom for multipart overhead
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Real client IP when the domain is proxied by Cloudflare (file generated by deploy.sh, may be empty)
    include /etc/nginx/generated/realip.conf;

    # Rate limiting (the app also has its own per-IP limiter in middlware/security.js)
    limit_req_zone $binary_remote_addr zone=doq_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=doq_auth:10m rate=20r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=doq_conn:10m;

    # WebSocket upgrade support (not used by the app today; harmless for normal requests)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream doq_app {
        server app:3000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/doq.conf;
}
