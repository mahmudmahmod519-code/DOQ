# ============================================================
# DOQ Staging Override - docker-compose.staging.yml
# Overrides for staging environment
# ============================================================

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-doq/doq}:latest
    env_file: !override
      - ${DOQ_ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: staging
      PUBLIC_URL: ${PUBLIC_URL:-https://staging.doq.example.com}
      DOQ_DOMAIN: ${DOQ_DOMAIN:-staging.doq.example.com}
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  db:
    environment:
      MYSQL_DATABASE: ${DB_NAME:-DOQ_staging}
    ports: !reset []
    volumes:
      - staging_mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOQ_DOMAIN: ${DOQ_DOMAIN:-staging.doq.example.com}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  staging_mysql_data:
    driver: local
  staging_caddy_data:
  staging_caddy_config:
