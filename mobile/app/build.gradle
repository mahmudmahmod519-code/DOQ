plugins {
    id 'com.android.application'
}

// Optional default server URL baked into the APK at build time.
// GitHub Actions passes this with: -PdoqServerUrl="http://192.168.1.10:8080"
def serverUrl = project.findProperty('doqServerUrl') ?: ''
def escapedServerUrl = serverUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.doq.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.doq.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', "\"${escapedServerUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
