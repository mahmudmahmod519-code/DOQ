name: Build DOQ Mobile APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Default server URL baked into the APK (optional, can be changed inside the app)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mobile
        env:
          DOQ_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          gradle assembleDebug --no-daemon -PdoqServerUrl="$DOQ_SERVER_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doq-mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Write build summary
        run: |
          {
            echo "## ✅ DOQ Mobile APK built"
            echo ""
            echo "- **APK:** \`app-debug.apk\` (artifact: \`doq-mobile-debug-apk\`)"
            echo "- **Default server URL:** \`${{ github.event.inputs.server_url }}\`"
            echo ""
            echo "### Install on Android"
            echo "1. Download the artifact from the run page."
            echo "2. Unzip it and copy \`app-debug.apk\` to the phone (or use \`adb install -r app-debug.apk\`)."
            echo "3. Allow \"Install unknown apps\" when prompted."
            echo "4. Open the app and enter your server URL, e.g. \`http://192.168.1.10:8080\` (hotspot) or your ngrok URL."
            echo ""
            echo "See \`mobile/README.md\` for server setup and troubleshooting."
          } >> "$GITHUB_STEP_SUMMARY"
