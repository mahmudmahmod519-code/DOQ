name: DOQ Customer – Google Play release (AAB)

# Builds the Flutter customer app (mobile_flutter/) as a Google Play-ready, upload-key-signed
# Android App Bundle (.aab). Optionally uploads it to a Play Console track as a DRAFT.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   Secrets:
#     ANDROID_KEYSTORE_BASE64     base64 of your upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD   keystore password
#     ANDROID_KEY_ALIAS           key alias (e.g. upload)
#     ANDROID_KEY_PASSWORD        key password
#     PLAY_SERVICE_ACCOUNT_JSON   (optional) service-account JSON for automatic upload
#   Variables:
#     DOQ_API_URL                 production server, e.g. https://doq.example.org   (required)
#     DOQ_APPLICATION_ID          Play package name, e.g. com.doq.doq_customer       (PERMANENT after first upload)
#
# Run: Actions -> "DOQ Customer – Google Play release (AAB)" -> Run workflow
# or push a tag like  play-v1.0.0  (version name = 1.0.0).

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Play (e.g. 1.0.0). Version code is generated automatically.'
        required: true
        default: '1.0.0'
      upload_to_play:
        description: 'Upload the AAB to Google Play as a draft (needs PLAY_SERVICE_ACCOUNT_JSON; the very first upload must be manual)'
        type: boolean
        default: false
      track:
        description: 'Play track for the draft upload'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  push:
    tags:
      - 'play-v*'

permissions:
  contents: write

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_flutter
    env:
      DOQ_API_URL: ${{ vars.DOQ_API_URL }}
      DOQ_APPLICATION_ID: ${{ vars.DOQ_APPLICATION_ID || 'com.doq.doq_customer' }}
      DOQ_RELEASE_SIGNING: 'true'
      DOQ_ALLOW_CLEARTEXT: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/play-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/play-v}"
          else
            NAME="${{ github.event.inputs.version_name }}"
          fi
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version name must look like 1.0.0 (got '$NAME')"; exit 1; }
          # Play needs a strictly increasing versionCode: 1000 + run number of this workflow
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($VERSION_CODE)"

      - name: Check required configuration
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS KS_PASS KEY_ALIAS KEY_PASS; do
            [[ -n "${!v}" ]] || { echo "::error::Missing secret for $v (see the header of this workflow / mobile_flutter/PLAY_STORE.md)"; missing=1; }
          done
          [[ "$DOQ_API_URL" == https://* ]] || { echo "::error::Repository variable DOQ_API_URL must be your HTTPS production URL (store builds are HTTPS-only)"; missing=1; }
          exit $missing

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Generate Android project
        run: flutter create --project-name doq_customer --org com.doq --platforms android .

      - name: Install upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore, password or alias is wrong"; exit 1; }

      - name: Patch Android project (signing, SDK 36, package name, HTTPS only)
        run: python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build App Bundle (.aab) for Google Play
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="$VERSION_CODE" \
            --dart-define=DOQ_API_URL="$DOQ_API_URL" \
            --dart-define=DOQ_LOCK_SERVER=true \
            --obfuscate --split-debug-info=build/debug-info

      - name: Build signed APK (for direct install / testing the same release)
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="$VERSION_CODE" \
            --dart-define=DOQ_API_URL="$DOQ_API_URL" \
            --dart-define=DOQ_LOCK_SERVER=true \
            --obfuscate --split-debug-info=build/debug-info

      - name: Verify signature (must be the upload key, not the debug key)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::AAB is not signed"; exit 1; }
          OWNER="$(keytool -printcert -jarfile "$AAB" | grep -m1 'Owner:')"
          echo "$OWNER"
          if echo "$OWNER" | grep -q "Android Debug"; then echo "::error::AAB is signed with the DEBUG key"; exit 1; fi

      - name: Collect release files
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/doq-customer-${V}-${VERSION_CODE}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/doq-customer-${V}-${VERSION_CODE}.apk"
          (cd build && zip -qr "../dist/debug-symbols-${V}-${VERSION_CODE}.zip" debug-info)
          MAPPING=build/app/outputs/mapping/release/mapping.txt
          [[ -f "$MAPPING" ]] && cp "$MAPPING" "dist/mapping-${V}-${VERSION_CODE}.txt" || true
          ls -lh dist
          rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doq-customer-play-${{ steps.version.outputs.name }}-${{ env.VERSION_CODE }}
          path: mobile_flutter/dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Google Play (draft)
        if: github.event.inputs.upload_to_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.DOQ_APPLICATION_ID }}
          releaseFiles: mobile_flutter/dist/*.aab
          track: ${{ github.event.inputs.track }}
          status: draft

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/play-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile_flutter/dist/*.aab
            mobile_flutter/dist/*.apk
          generate_release_notes: true
