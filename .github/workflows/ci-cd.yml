name: DOQ CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # LINT & TEST
  # ============================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Check for console.log in production code
        run: |
          if grep -r "console\.log" --include="*.js" --include="*.ejs" --exclude-dir=node_modules --exclude-dir=.git . | grep -v "test\|spec\|console.log.*DEV\|console.log.*DEBUG"; then
            echo "⚠️ Found console.log in production code"
            exit 1
          fi

  # ============================================================
  # BUILD DOCKER IMAGE
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ============================================================
  # SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: |
          docker run --rm ${{ needs.build.outputs.image-tag }} npm audit --audit-level=high || true

  # ============================================================
  # DEPLOY TO STAGING
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            cd /opt/doq
            export DOMAIN=staging.doq.example.com
            export ENVIRONMENT=staging
            ./scripts/deploy-vps.sh staging

      - name: Run smoke tests
        run: |
          sleep 10
          curl -f https://staging.doq.example.com/health || exit 1
          curl -f https://staging.doq.example.com/security/csrf | grep -q '"token"' || exit 1
          echo "✅ Staging smoke tests passed"

      - name: Notify on Slack (optional)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "Staging deployment ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================================
  # DEPLOY TO PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment tag
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)-${{ github.sha::8 }}"
          echo "DEPLOY_TAG=$TAG" >> $GITHUB_ENV
          git tag -a "$TAG" -m "Production deployment $TAG"
          git push origin "$TAG"

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd /opt/doq
            export DOMAIN=doq.example.com
            export ENVIRONMENT=production
            ./scripts/deploy-vps.sh production

      - name: Run production smoke tests
        run: |
          sleep 15
          curl -f https://doq.example.com/health || exit 1
          curl -f https://doq.example.com/security/csrf | grep -q '"token"' || exit 1
          curl -f https://doq.example.com/api/v1/status || exit 1
          echo "✅ Production smoke tests passed"

      - name: Notify on Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "Production deployment ${{ job.status }} - ${{ env.DEPLOY_TAG }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.DEPLOY_TAG }}
          name: "Release ${{ env.DEPLOY_TAG }}"
          body: |
            ## Deployment to Production
            
            **Commit:** ${{ github.sha }}
            **Branch:** main
            **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Verification
            - ✅ All tests passed
            - ✅ Security scan passed
            - ✅ Staging deployment verified
            - ✅ Production smoke tests passed
            
            ### Rollback
            If issues arise, rollback with:
            \`\`\`bash
            ./scripts/rollback.sh ${{ env.DEPLOY_TAG }}
            \`\`\`
          draft: false
          prerelease: false

  # ============================================================
  # ROLLBACK WORKFLOW (manual trigger)
  # ============================================================
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd /opt/doq
            echo "Available tags:"
            git tag --sort=-v:refname | head -10
            
            PREVIOUS_TAG=$(git tag --sort=-v:refname | sed -n '2p')
            echo "Rolling back to: $PREVIOUS_TAG"
            
            git checkout "$PREVIOUS_TAG"
            ./scripts/deploy-vps.sh production
            
            echo "✅ Rollback complete to $PREVIOUS_TAG"